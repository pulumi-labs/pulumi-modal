name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A YAML program to provision a Modal secret, volume, and queue for serverless GPU workloads.
  config:
    secretName:
      description: Name for the Modal secret.
      default: app-secrets
    volumeName:
      description: Name for the Modal volume.
      default: app-volume
    queueName:
      description: Name for the Modal queue.
      default: app-queue

config:
  secretName:
    type: string
    default: app-secrets
  volumeName:
    type: string
    default: app-volume
  queueName:
    type: string
    default: app-queue

resources:
  secret:
    type: modal:index:Secret
    properties:
      name: ${secretName}
      values:
        API_KEY: changeme

  volume:
    type: modal:index:Volume
    properties:
      name: ${volumeName}

  queue:
    type: modal:index:Queue
    properties:
      name: ${queueName}

outputs:
  secretId: ${secret.secretId}
  volumeId: ${volume.volumeId}
  queueId: ${queue.queueId}
