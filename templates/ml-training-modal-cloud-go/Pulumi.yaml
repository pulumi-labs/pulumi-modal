name: ${PROJECT}
description: ${DESCRIPTION}
runtime: go

template:
  description: A Go program to provision the Modal Secret, Volume, and Queue backing an ML training pipeline.
  config:
    tokenId:
      description: Modal API token ID. Leave blank to fall back to the MODAL_TOKEN_ID environment variable.
      secret: true
    tokenSecret:
      description: Modal API token secret. Leave blank to fall back to the MODAL_TOKEN_SECRET environment variable.
      secret: true
    hfToken:
      description: Hugging Face access token used by training Functions.
      secret: true
    checkpointVolumeName:
      description: Name for the Modal Volume that stores training checkpoints.
      default: training-checkpoints
    trainingQueueName:
      description: Name for the Modal Queue that dispatches training jobs.
      default: training-jobs
