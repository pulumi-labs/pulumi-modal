name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A YAML program to provision a Modal environment, App, Dict and published Image.
  config:
    environmentName:
      description: Name for the Modal environment.
      default: platform
    appName:
      description: Name for the Modal App.
      default: platform-app
    dictName:
      description: Name for the Modal Dict.
      default: platform-state
    imageName:
      description: Name for the published Modal Image.
      default: platform-base

config:
  environmentName:
    type: string
    default: platform
  appName:
    type: string
    default: platform-app
  dictName:
    type: string
    default: platform-state
  imageName:
    type: string
    default: platform-base

resources:
  # The Modal environment isolates Apps, Dicts and Images; capped at 20 concurrent tasks.
  env:
    type: modal:index:Environment
    properties:
      name: ${environmentName}
      maxConcurrentTasks: 20

  # The App groups deployed Functions; referencing env.name makes the dependency implicit.
  app:
    type: modal:index:App
    properties:
      name: ${appName}
      environment: ${env.name}
      tags:
        team: ml
        managedBy: pulumi

  # The Dict is a durable key-value store shared between Modal Functions.
  state:
    type: modal:index:Dict
    properties:
      name: ${dictName}
      environment: ${env.name}

  # The Image is built from a slim Python base with pinned numpy and published to the environment.
  base:
    type: modal:index:Image
    properties:
      baseImage: python:3.12-slim
      dockerfileCommands:
        - RUN pip install numpy==2.1.3
      name: ${imageName}
      environment: ${env.name}

variables:
  # Look up the workspace the credentials belong to (MODAL_TOKEN_ID / MODAL_TOKEN_SECRET).
  workspace:
    fn::invoke:
      function: modal:index:getWorkspace
      arguments: {}
  # Look up the workspace's default environment.
  defaultEnvironment:
    fn::invoke:
      function: modal:index:getEnvironment
      arguments:
        name: ${workspace.defaultEnvironment}

outputs:
  environmentId: ${env.environmentId}
  appId: ${app.appId}
  dictId: ${state.dictId}
  imageId: ${base.imageId}
  workspaceName: ${workspace.workspaceName}
  defaultEnvironmentWebSuffix: ${defaultEnvironment.webSuffix}
