name: ${PROJECT}
description: ${DESCRIPTION}
runtime: dotnet

template:
  description: A C# program to provision a Modal secret, volume, and queue for serverless GPU workloads.
  config:
    secretName:
      description: Name for the Modal secret.
      default: app-secrets
    volumeName:
      description: Name for the Modal volume.
      default: app-volume
    queueName:
      description: Name for the Modal queue.
      default: app-queue
