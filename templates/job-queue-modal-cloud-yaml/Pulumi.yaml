# Background job queue — Modal
#
# Provisions a Modal Queue that a web app or scheduler enqueues jobs
# onto, plus a Secret carrying the API key background worker Functions
# use to authenticate callbacks back to your application.
#
# Your Modal application code looks these up by name at runtime:
#
#   queue = modal.Queue.from_name("background-jobs")
#   secret = modal.Secret.from_name("worker-callback-secret")
name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A YAML program to provision a Modal Queue and its callback-authentication Secret for a background job pipeline.
  config:
    tokenId:
      description: Modal API token ID. Leave blank to fall back to the MODAL_TOKEN_ID environment variable.
      secret: true
    tokenSecret:
      description: Modal API token secret. Leave blank to fall back to the MODAL_TOKEN_SECRET environment variable.
      secret: true
    queueName:
      description: Name for the Modal Queue.
      default: background-jobs
    workerApiKey:
      description: API key background workers use to authenticate callbacks.
      secret: true

config:
  tokenId:
    type: string
    secret: true
  tokenSecret:
    type: string
    secret: true
  queueName:
    type: string
    default: background-jobs
  workerApiKey:
    type: string
    secret: true

resources:
  # API key background workers use to authenticate callbacks to your
  # application once a job completes.
  secret:
    type: modal:index:Secret
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: worker-callback-secret
      values:
        WORKER_API_KEY: ${workerApiKey}

  # Durable queue a dispatcher enqueues jobs onto; a pool of worker
  # Functions pulls from it to process them asynchronously.
  queue:
    type: modal:index:Queue
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: ${queueName}

outputs:
  secretId: ${secret.secretId}
  queueId: ${queue.queueId}
