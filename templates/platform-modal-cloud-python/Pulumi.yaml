name: ${PROJECT}
description: ${DESCRIPTION}
runtime: python

template:
  description: A Python program to provision a Modal environment, App, Dict and published Image.
  config:
    environmentName:
      description: Name for the Modal Environment.
      default: platform
    appName:
      description: Name for the Modal App.
      default: platform-app
    dictName:
      description: Name for the Modal Dict.
      default: platform-state
    imageName:
      description: Name for the published Modal Image.
      default: platform-base
