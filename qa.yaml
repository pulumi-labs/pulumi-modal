# Runtime QA manifest (AGENTS.md, "Runtime QA manifest"). Checked by tools/qa-manifest.
# Credential values live in ESC, never here.
credentials:
  - name: MODAL_TOKEN_ID
    required: true
  - name: MODAL_TOKEN_SECRET
    required: true
  - name: MODAL_ENVIRONMENT
    required: false
  - name: MODAL_SERVER_ADDR
    required: false # test-only override of the gRPC endpoint; leave unset
account: >-
  A Modal workspace on any plan with an API token (token id and secret). Secrets, Volumes, Queues, Dicts,
  Apps and Environments are free metadata objects. Whether the workspace plan limits the number of
  Environments is not verified; if Environment creation is refused for plan reasons, record that instead
  of failing the release.
resources:
  - type: modal:index:Secret
    test: true
    update: values
    cost: none
  - type: modal:index:Volume
    test: true
    update: name
    cost: none
  - type: modal:index:Queue
    test: true
    update: null
    cost: none
  - type: modal:index:Dict
    test: true
    update: null
    cost: none
  - type: modal:index:Environment
    test: true
    update: maxConcurrentTasks
    cost: none
  - type: modal:index:App
    test: true
    update: tags
    cost: none
  - type: modal:index:Image
    test: true
    update: name
    cost: "compute: one image build per run, billed as Modal build time"
functions:
  - name: getSecret
    test: true
  - name: getVolume
    test: true
  - name: getQueue
    test: true
  - name: getDict
    test: true
  - name: getEnvironment
    test: true
  - name: getApp
    test: true
  - name: getImage
    test: true
  - name: getWorkspace
    test: true
  - name: getFunction
    test: false
    reason: needs an already deployed Modal Function; the provider cannot deploy code (modal deploy is out of scope), so QA has nothing to look up
  - name: getCls
    test: false
    reason: needs an already deployed Modal Cls; the provider cannot deploy code (modal deploy is out of scope), so QA has nothing to look up
  - name: getProxy
    test: false
    reason: proxies are created in the Modal dashboard on a paid plan and the provider cannot create one, so QA has nothing to look up
regressions:
  - "#1418/#1440 a Volume with fsVersion set is not replaced on a second up"
  - "#1464 App create succeeds (no 'Invalid object creation type') and a duplicate name still fails"
  - "#1465 Environment update keeps environmentId and name (no spurious rename)"
  - "#1466 App and Image create send a known modal-go client version"
  - "#1467 getApp on a missing App errors 'app ... was not found' instead of returning an empty ID"
  - "#1515 import a Secret by ID, then pulumi preview --expect-no-changes shows no changes (values update not planned)"
  - "#1490 getQueue, getVolume and getDict report the effective environment"
notes: >-
  An Image build creates the App named pulumi-image-builds in the environment; its intermediate layers are
  not deleted when the Image is destroyed. Sandbox is deferred. Modal's gRPC control-plane API is not
  formally stable, so a provider release can break against a new server.
