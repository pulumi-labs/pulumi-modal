# Runtime QA manifest (AGENTS.md, "Runtime QA manifest"). Checked by tools/qa-manifest.
# Credential values live in ESC, never here.
credentials:
  - name: MODAL_TOKEN_ID
    required: true
  - name: MODAL_TOKEN_SECRET
    required: true
  - name: MODAL_ENVIRONMENT
    required: false
  - name: MODAL_SERVER_ADDR
    required: false # test-only override of the gRPC endpoint; leave unset
account: >-
  A Modal workspace on any plan with an API token (token id and secret). Secrets, Volumes, Queues, Dicts,
  Apps and Environments are free metadata objects. Whether the workspace plan limits the number of
  Environments is not verified; if Environment creation is refused for plan reasons, record that instead
  of failing the release.
resources:
  - type: modal:index:Secret
    test: true
    update: values
    cost: none
  - type: modal:index:Volume
    test: true
    update: name
    cost: none
  - type: modal:index:Queue
    test: true
    update: null
    cost: none
  - type: modal:index:Dict
    test: true
    update: null
    cost: none
  - type: modal:index:Environment
    test: true
    update: maxConcurrentTasks
    cost: none
  - type: modal:index:App
    test: true
    update: tags
    cost: none
  - type: modal:index:Image
    test: true
    update: name
    cost: "compute: one image build per run, billed as Modal build time"
  - type: modal:index:ServiceUser
    test: true
    update: null
    cost: none
  - type: modal:index:WebhookToken
    test: true
    update: name
    cost: none
  - type: modal:index:Proxy
    test: false
    reason: static IP addresses are a paid Modal plan feature and the QA workspace may not have it; the create, ipCount update and delete flows are covered by the fake control plane tests
    update: ipCount
    cost: "paid plan: static IPs are billed monthly per address"
  - type: modal:index:AppDeployment
    test: false
    reason: runs `modal deploy`, which needs the Modal CLI and its Python package on the QA runner and deploys a real app; the argument, environment, redeploy, redaction and read-back behavior is covered by tests that use a fake CLI and a fake control plane
    update: tag
    cost: "compute: a deployed app is billed only while it runs"
functions:
  - name: getSecret
    test: true
  - name: getVolume
    test: true
  - name: getQueue
    test: true
  - name: getDict
    test: true
  - name: getEnvironment
    test: true
  - name: getApp
    test: true
  - name: getImage
    test: true
  - name: getWorkspace
    test: true
  - name: getServiceUser
    test: true
  - name: getWebhookToken
    test: true
  - name: getAppDeployment
    test: false
    reason: needs a deployed Modal App, and QA does not run AppDeployment (it needs the Modal CLI), so there is nothing to look up
  - name: getFunction
    test: false
    reason: needs an already deployed Modal Function; the AppDeployment resource needs the Modal CLI and QA does not run it, so QA has nothing to look up
  - name: getCls
    test: false
    reason: needs an already deployed Modal Cls; the AppDeployment resource needs the Modal CLI and QA does not run it, so QA has nothing to look up
  - name: getProxy
    test: false
    reason: static IPs need a paid plan and QA does not run the Proxy resource, so QA has nothing to look up
regressions:
  - "#1612 import an Image published in a non-default environment (pulumi import modal:index:Image x im-...): the state and inputs record that environment and the next preview plans no replace; an Image published in two environments fails the import naming both"
  - "#1613 change an Image's dockerfileCommands or baseImage and run pulumi up: the new Image exists afterwards (imageId differs from before, getImage by name returns it); with the same name in two environments, deleting one leaves the other's name"
  - "#1577 import then inspect the stack state (pulumi stack export --show-secrets off): every property the schema marks secret on an imported resource is a secret, never plaintext; a refresh of a resource created by the program keeps them secret"
  - "#1418/#1440 a Volume with fsVersion set is not replaced on a second up"
  - "#1464 App create succeeds (no 'Invalid object creation type') and a duplicate name still fails"
  - "#1465 Environment update keeps environmentId and name (no spurious rename)"
  - "#1466 App and Image create send a known modal-go client version"
  - "#1467 getApp on a missing App errors 'app ... was not found' instead of returning an empty ID"
  - "#1515 import a Secret by ID, then pulumi preview --expect-no-changes shows no changes (values update not planned)"
  - "#1490 getQueue, getVolume and getDict report the effective environment"
notes: >-
  An Image build creates the App named pulumi-image-builds in the environment; its intermediate layers are
  not deleted when the Image is destroyed. Sandbox is deferred. Modal's gRPC control-plane API is not
  formally stable, so a provider release can break against a new server.
