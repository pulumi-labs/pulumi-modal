name: modal-yaml-ml-pipeline
runtime: yaml
description: Provision Modal infrastructure for an ML training and inference pipeline with Pulumi (YAML)

config:
  tokenId:
    type: string
    secret: true
  tokenSecret:
    type: string
    secret: true

resources:
  # Credentials Modal Functions read at runtime via modal.Secret.from_name("inference-secrets").
  inference-secrets:
    type: modal:index:Secret
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: inference-secrets
      values:
        HF_TOKEN: hf_placeholder_token
        OPENAI_API_KEY: sk_placeholder

  # Durable model checkpoint storage mounted via modal.Volume.from_name("checkpoint-storage").
  checkpoint-storage:
    type: modal:index:Volume
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: checkpoint-storage
      version: v2

  # Dispatch queue for training job requests, consumed via modal.Queue.from_name("training-jobs").
  training-jobs:
    type: modal:index:Queue
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: training-jobs

outputs:
  secretId: ${inference-secrets.secretId}
  checkpointVolumeId: ${checkpoint-storage.volumeId}
  trainingQueueId: ${training-jobs.queueId}
