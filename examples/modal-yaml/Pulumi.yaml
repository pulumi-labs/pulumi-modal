name: modal-yaml
runtime: yaml
description: Provision Modal secrets, volumes, and queues for serverless GPU workloads with Pulumi (YAML)

config:
  tokenId:
    type: string
    secret: true
  tokenSecret:
    type: string
    secret: true

resources:
  # Secrets mount as environment variables into Modal Functions at runtime.
  api-keys:
    type: modal:index:Secret
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: api-keys
      values:
        STRIPE_API_KEY: sk_live_xxx_placeholder
        SENDGRID_API_KEY: SG.xxx_placeholder

  # Volumes are durable network filesystems that Modal Functions mount for shared, persistent state (e.g. model weights).
  model-cache:
    type: modal:index:Volume
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: model-cache
      version: v2

  # Queues are durable FIFO/LIFO dispatch queues used to coordinate work between Modal Functions.
  job-queue:
    type: modal:index:Queue
    properties:
      tokenId: ${tokenId}
      tokenSecret: ${tokenSecret}
      name: job-queue

outputs:
  secretId: ${api-keys.secretId}
  volumeId: ${model-cache.volumeId}
  queueId: ${job-queue.queueId}
